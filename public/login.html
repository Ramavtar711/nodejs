<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; }
    .login-box { width: 300px; margin: 100px auto; padding: 20px; background: white; text-align: center; border-radius: 10px; }
    input, button { width: 90%; padding: 10px; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <p id="errorMsg" style="color:red;"></p>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required><br>
      <input type="password" id="password" placeholder="Password" required><br>
      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("http://localhost:3000/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if(res.ok) {
          // Store token in localStorage
          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.user));
          alert(`Welcome ${data.user.name}`);
          window.location.href = "http://localhost:3000/admin/dashboard"; // Redirect to dashboard
        } else {
          errorMsg.textContent = data.message;
        }
      } catch(err) {
        errorMsg.textContent = "Server error!";
      }
    });
  </script>
</body>
</html>
